<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AccessAI UAE</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; width: 100%; overflow: hidden; background: #0b0b0c; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #0b1f3a; }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    border-radius: 6px;
  }
  ::-webkit-scrollbar-thumb:hover { background: #2563eb; }

  * { scrollbar-color: #2563eb #0b1f3a; scrollbar-width: thin; }

  .frame-wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
  }

  iframe {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
  }

  .credit-tag {
    position: absolute;
    bottom: 10px;
    right: 10px;
    min-width: 300px;
    min-height: 56px;
    padding: 12px 22px;
    background: linear-gradient(135deg, #1e3a8a, #2563eb);
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    z-index: 10;
  }
</style>
</head>
<body>
  <div class="frame-wrap">
    <iframe
      src="https://githubaccessaiuae.base44.app"
      title="AccessAI UAE"
      allow="camera; microphone; geolocation; clipboard-write"
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
    <div class="credit-tag">by Sai Pranav</div>
  </div>
</body>
</html>
