<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AccessAI UAE</title>
  
  <meta name="theme-color" content="#090d16" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #090d16;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    .frame-container {
      position: relative;
      width: 100vw;
      height: 100dvh;
      overflow: hidden;
    }

    /* Full App Iframe */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      outline: none;
      display: block;
      opacity: 0;
      transition: opacity 0.3s ease-in;
    }

    iframe.loaded {
      opacity: 1;
    }

    /* 
      =======================================================
      BIG WATERMARK SHIELD (COVERS BASE44 COMPLETELY)
      =======================================================
    */
    .watermark-shield {
      position: absolute;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      right: 12px; /* <-- CHANGE TO 'left: 12px;' IF WATERMARK IS ON THE LEFT */
      z-index: 999999;
      
      /* Solid Big Dimensions to completely bury the watermark */
      min-width: 250px;
      height: 48px;
      padding: 0 18px;
      
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      
      /* 100% Solid dark background - zero see-through */
      background: #090d16;
      border: 1.5px solid #1e293b;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 255, 255, 0.05);
      
      color: #f8fafc;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      pointer-events: auto;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .watermark-shield:hover {
      transform: translateY(-2px);
      border-color: #38bdf8;
    }

    .shield-badge {
      background: linear-gradient(135deg, #0284c7, #38bdf8);
      color: #000;
      font-size: 10px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .creator-name {
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 10px #22c55e;
      flex-shrink: 0;
    }

    /* Fast Preloader */
    .loader-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      z-index: 10000;
      transition: opacity 0.4s ease, visibility 0.4s ease;
      gap: 14px;
    }

    .loader-overlay.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: #38bdf8;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="frame-container">
    <!-- Loading Screen -->
    <div id="loader" class="loader-overlay">
      <div class="spinner"></div>
      <span style="color: #94a3b8; font-size: 13px;">Loading AccessAI UAE...</span>
    </div>

    <!-- App View -->
    <iframe
      id="app-frame"
      src="https://githubaccessaiuae.base44.app"
      title="AccessAI UAE"
      allow="camera; microphone; geolocation; clipboard-read; clipboard-write; encrypted-media; autoplay"
      loading="eager"
    ></iframe>

    <!-- 
      LARGE WATERMARK COVER SHIELD:
      Completely covers Base44 badge with Sai Pranav branding 
    -->
    <div class="watermark-shield">
      <span class="status-dot"></span>
      <span class="shield-badge">DEV</span>
      <span class="creator-name">by Sai Pranav</span>
    </div>
  </div>

  <script>
    const iframe = document.getElementById("app-frame");
    const loader = document.getElementById("loader");

    // Reveal iframe once loaded
    iframe.addEventListener("load", () => {
      iframe.classList.add("loaded");
      loader.classList.add("hidden");
    });

    // Fallback load timeout
    setTimeout(() => {
      loader.classList.add("hidden");
      iframe.classList.add("loaded");
    }, 5000);

    // Disable Right-Click
    document.addEventListener("contextmenu", (e) => e.preventDefault());

    // Disable Inspect / Source shortcuts
    document.addEventListener("keydown", (e) => {
      const isCtrlOrCmd = e.ctrlKey || e.metaKey;
      const key = e.key.toUpperCase();
      if (
        e.key === "F12" ||
        (isCtrlOrCmd && e.shiftKey && ["I", "J", "C"].includes(key)) ||
        (isCtrlOrCmd && ["U", "S", "P"].includes(key))
      ) {
        e.preventDefault();
      }
    });
  </script>
</body>
</html>
